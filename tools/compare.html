<!doctype html>
<meta charset="utf-8">
<title>LDraw match review</title>
<style>
  body { margin: 0; font: 13px system-ui; background: #f3f5f8; }
  #grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; padding: 4px; }
  .c { background: #fff; border-radius: 6px; overflow: hidden; }
  .c canvas { width: 100%; display: block; }
  .c div { padding: 3px 5px; height: 44px; overflow: hidden; line-height: 1.25; }
</style>
<div id="grid"></div>
<script type="module">
// Local review page: blue = Mecabricks mesh, orange = the LDraw part placed by data/ldraw-map.json.
import * as THREE from 'three';
const rows = await fetch('/data/debug/compare.json').then((r) => r.json());
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(220, 180);
const mk = ([p, i], mat) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); g.setIndex(i); g.computeVertexNormals(); return new THREE.Mesh(g, mat); };
for (const row of rows) {
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#ffffff');
  scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 1.2)); const d = new THREE.DirectionalLight(0xffffff, 1.5); d.position.set(-1, 2, 1.5); scene.add(d);
  const ld = mk(row.ld, new THREE.MeshStandardMaterial({ color: '#ff8a1f', flatShading: true }));
  const me = mk(row.meca, new THREE.MeshStandardMaterial({ color: '#2f7cf6', transparent: true, opacity: 0.38, depthWrite: false }));
  scene.add(ld, me);
  const box = new THREE.Box3().setFromObject(me).union(new THREE.Box3().setFromObject(ld));
  const s = box.getBoundingSphere(new THREE.Sphere());
  const cam = new THREE.PerspectiveCamera(30, 220 / 180, 0.1, 5000);
  cam.position.copy(s.center).add(new THREE.Vector3(-1, 0.9, 1.3).normalize().multiplyScalar(s.radius / Math.sin(Math.PI / 12) * 1.05));
  cam.lookAt(s.center);
  r.render(scene, cam);
  const c = document.createElement('div'); c.className = 'c';
  const img = new Image(); img.src = r.domElement.toDataURL(); img.style.width = '100%';
  c.append(img);
  const t = document.createElement('div');
  t.textContent = `${row.ref} ${row.name} → ${row.ldraw} (${row.err} mm)`;
  c.append(t);
  document.getElementById('grid').append(c);
}
document.title = 'done';
</script>
